<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – InternNova</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="lgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C4CF1"/><stop offset="1" stop-color="#16C9A8"/></linearGradient>
<symbol id="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="12" fill="url(#lgG)"/><path d="M11 29V11l18 18V11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="9" r="2.6" fill="#FFB033"/></symbol>
</defs></svg>

<div class="shell">
  <!-- LEFT: company logo + menu -->
  <aside class="side">
    <a class="brand" href="index.html" aria-label="InternNova"><svg><use href="#logo"/></svg>InternNova</a>
    <nav id="menu" aria-label="Dashboard"></nav>
    <div class="sidebox"><small>Overall progress</small><b id="sidePct">0%</b><div class="bar"><i id="sideBar"></i></div></div>
  </aside>

  <div class="mainCol">
    <!-- RIGHT: profile + logout -->
    <header class="top">
      <h1 id="pageTitle">Home</h1>
      <div class="prof">
        <button class="pbtn" id="profBtn" aria-haspopup="true" aria-expanded="false"><span class="av" id="avTop"></span><span class="pn"><b id="nameTop"></b><small id="domTop"></small></span></button>
        <button class="btn ghost sm" id="logoutTop">Logout</button>
        <div class="ppanel" id="profPanel" hidden>
          <div class="av big" id="avBig"></div>
          <h3 id="pName"></h3>
          <dl id="pList"></dl>
          <button class="btn block" id="logoutPanel">Logout</button>
        </div>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="modalBg" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><button class="x" id="mClose" aria-label="Close">&times;</button><div id="mBody"></div></div></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
